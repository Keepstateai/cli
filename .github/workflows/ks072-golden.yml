name: ks072-golden
# KS-072 drift guard: the client's Cruise test discovery is a port of the
# service's, held to the service's golden layouts (testdata/ks072).
#
# Always: the vendored files must hash to what testdata/ks072/SOURCE.json
# records (no secret needed), and the port must reproduce the golden.
#
# When the repository variable KS_SERVER_REPO (owner/name) and the secret
# KS_SERVER_READ_TOKEN are configured: the service's current golden must
# hash the same as the vendored one, so a change on the service side fails
# here instead of being remembered. Until then the job says, as a notice,
# that the server comparison is NOT CONFIGURED -- which is not a pass of
# that comparison, only of the vendored one.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden:
    runs-on: ubuntu-latest
    env:
      KS_SERVER_REPO: ${{ vars.KS_SERVER_REPO }}
      TOKEN_SET: ${{ secrets.KS_SERVER_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vendored golden against SOURCE.json, and the port against the golden
        run: go test -count=1 -run 'TestKS072' ./...
      - name: Server comparison NOT CONFIGURED
        if: ${{ env.KS_SERVER_REPO == '' || env.TOKEN_SET != 'true' }}
        run: |
          echo "::notice title=ks072-golden::server comparison NOT CONFIGURED: KS_SERVER_REPO (variable) and KS_SERVER_READ_TOKEN (secret) are not set, so the vendored golden was checked against SOURCE.json only, NOT against the service's current golden"
      - uses: actions/checkout@v4
        if: ${{ env.KS_SERVER_REPO != '' && env.TOKEN_SET == 'true' }}
        with:
          repository: ${{ vars.KS_SERVER_REPO }}
          token: ${{ secrets.KS_SERVER_READ_TOKEN }}
          path: server
          sparse-checkout: judge/tests/golden
      - name: Vendored golden against the service's current golden
        if: ${{ env.KS_SERVER_REPO != '' && env.TOKEN_SET == 'true' }}
        run: KS_SERVER_CHECKOUT="$GITHUB_WORKSPACE/server" go test -count=1 -run 'TestKS072VendoredGolden' -v ./...

name: npm-sabotage
# The trusted-publishing sabotage (founder order 2026-09-04, item 4):
# this workflow attempts an npm publish with a VALID GitHub OIDC token
# whose job_workflow_ref names THIS file, not release.yml. npm's trusted
# publisher pins release.yml, so the exchange must be refused and
# nothing published. The gate is GREEN when the publish FAILS.
# Manual dispatch only; it can never succeed while the publisher pins
# release.yml, so keeping it in-tree is safe by construction.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  sabotage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g npm@latest && npm --version
      - name: Publish attempt MUST be refused
        working-directory: npm
        run: |
          set +e
          npm publish --provenance --access public > out.log 2>&1
          rc=$?
          cat out.log
          if [ $rc -eq 0 ]; then
            echo "::error::SABOTAGE RED: npm accepted a publish from an unauthorized workflow"
            exit 1
          fi
          echo "SABOTAGE GREEN: npm refused the unauthorized workflow (exit $rc)"
